# SPDX-License-Identifier: GPL-3.0-or-later
# The CPPMPAS CPU test suite (CTest, tests/CMakeLists.txt) on GitHub-hosted runners, against the MPAS 8.4.2 FP64
# references of Xassemblianist/cppmpas-data at tolerance 0.
# - build: the Debian 13 image of the references (ci/Dockerfile: glibc 2.41, gcc / gfortran 14.2), the Release CPU
#   build, the Intel libmvec preload, and the split of the selected tests into jobs (ci/plan.py). The image goes to
#   the test jobs as the artifact "image", with its SHA-256 as a job output.
# - test: one job per part of the split; ctest under LD_PRELOAD of the preload (ci/run_tests.sh). Its inputs
#   (ci/data.tsv): the ones the plan gives a cache key (the small, often used ones) are restored from the Actions
#   cache; every input the cache did not give is downloaded from its release, and a downloaded cacheable one is saved.
#   Every input is checked against its SHA-256 before use (ci/data.sh). A cache miss or an evicted entry is never a
#   failure: nothing in a run depends on a cache entry (the repository's cache is 10 GB, the releases more).
# - summary: every selected test must pass; the GPU tests must be skipped (this is a CPU build) and are counted
#   as skipped, never as passed (ci/summary.py).
# Start: gh workflow run cpu_suite.yml --ref <branch holding this file> -f ref=<branch or commit> -f labels=all
# A commit that is not on GitHub: tools/ci/ci_submit.sh (inputs bundle, bundle_sha256, tag; ci/fetch_bundle.sh). The
# bundle is needed only by the build job, which hands the source tree to the other jobs as the artifact "src".
# Which tree each file comes from:
# - this file, and ci/fetch_bundle.sh (it runs before the commit under test is checked out), from the workflow's ref
#   (checkout "wf");
# - everything else from the commit under test (src/ci): the image (Dockerfile, debian-packages.txt), in_container.sh,
#   build.sh, the plan (plan.py, data.tsv, costs.tsv), data.sh, run_tests.sh and summary.py. A commit can so add a
#   reference release to ci/data.tsv, or change the planner, and be tested before it is on main.
# The guarantees that must not depend on the commit under test are kept by this file itself: the bundle's SHA-256
# (fetch_bundle.sh), the image's SHA-256 recorded when it was built and checked on every load, the download of every
# input the cache did not give, at most 10 test jobs at once, and the verdict job's own check of every JUnit result
# (every selected CPU test passed, every GPU test skipped, at least one CPU test, every job succeeded).
# cache_salt (tools/ci/ci_submit.sh --cache-salt): appended to every cache key, so that nothing restores (the proof
# that a run does not need the cache); its entries are deleted afterwards (gh cache delete).
name: cpu_suite
run-name: ${{ inputs.tag || format('cpu_suite {0} {1}', inputs.labels || 'all', inputs.ref || github.sha) }}
on:
  workflow_dispatch:
    inputs:
      ref: {description: "CPPMPAS branch or commit to test", required: true, default: main}
      labels: {description: "short (tests without the label long), long, or all", type: choice,
               options: [all, short, long], default: all}
      bundle: {description: "asset of Xassemblianist/cppmpas-data's jobs release holding ref (a git bundle; ref is then its full sha); empty: ref is on GitHub",
               default: ""}
      bundle_sha256: {description: "SHA-256 of the bundle", default: ""}
      tag: {description: "a name for the run (ci_submit.sh finds the run by it)", default: ""}
      max_parallel: {description: "test jobs at once (at most 10)", default: "10"}
      cache_salt: {description: "appended to every cache key (empty: the normal keys)", default: ""}
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  # bash -eo pipefail: a failing command before a pipe (plan.py | tee) fails its step
  run: {shell: bash}
concurrency:
  # pushes to main: only the newest runs; every dispatch runs on its own
  group: cpu_suite-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  REF: ${{ inputs.ref || github.sha }}
  LABELS: ${{ inputs.labels || 'all' }}
  # Xassemblianist/cppmpas-data at the commit whose ci/mvec_intel built the references' preload
  MVEC_REPO: Xassemblianist/cppmpas-data
  MVEC_COMMIT: 6065fe34c6cc846f2153a314dc28ffcb425192d8
  GH_TOKEN: ${{ github.token }}
  SALT: ${{ inputs.cache_salt && format('-{0}', inputs.cache_salt) || '' }}
jobs:
  build:
    # a push runs the suite only on main
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      commit: ${{ steps.src.outputs.commit }}
      image_sha256: ${{ steps.image.outputs.image_sha256 }}
      common_key: ${{ steps.plan.outputs.common_key }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # the workflow's own ref: only ci/fetch_bundle.sh is used from it
      - uses: actions/checkout@v4
        with: {path: wf, sparse-checkout: ci/fetch_bundle.sh, sparse-checkout-cone-mode: false}
      - uses: actions/checkout@v4
        if: inputs.bundle == ''
        with: {ref: "${{ env.REF }}", path: src}
      # a commit that is not on GitHub: main's whole history (the bundle's prerequisites), then the bundle
      - uses: actions/checkout@v4
        if: inputs.bundle != ''
        with: {ref: main, path: src, fetch-depth: 0}
      - name: source from the bundle
        if: inputs.bundle != ''
        env: {BUNDLE: "${{ inputs.bundle }}", BUNDLE_SHA256: "${{ inputs.bundle_sha256 }}"}
        run: bash wf/ci/fetch_bundle.sh src "$BUNDLE" "$BUNDLE_SHA256" "$REF"
      - uses: actions/checkout@v4
        with: {repository: "${{ env.MVEC_REPO }}", ref: "${{ env.MVEC_COMMIT }}", path: mvec-repo,
               sparse-checkout: ci/mvec_intel, sparse-checkout-cone-mode: false}
      - name: commit under test
        id: src
        run: |
          commit=$(git -C src rev-parse HEAD)
          # a full sha (ci_submit.sh, a push) must be the commit checked out
          if [[ $REF =~ ^[0-9a-f]{40}$ ]] && [ "$commit" != "$REF" ]; then echo "src is $commit, not $REF"; exit 1; fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          mkdir -p plan && git -C src log -1 --format='%H %s' | tee plan/commit.txt
      # the image of the commit under test (src/ci/Dockerfile). Its cache entry (only this job reads it: it saves the
      # docker build) has a key that ends in the SHA-256 of the image archive, recorded when the archive was made;
      # every load checks it. The test jobs get the archive as the artifact "image" and check it against the
      # SHA-256 of this job's output (an evicted cache entry means a docker build here, never a failed test job).
      - name: image key
        id: key
        run: echo "prefix=cpu-suite-image$SALT-$(cat src/ci/Dockerfile src/ci/debian-packages.txt | sha256sum | cut -c1-16)-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with: {path: dl/image, key: "${{ steps.key.outputs.prefix }}none", restore-keys: "${{ steps.key.outputs.prefix }}"}
      - name: image (Debian 13, pinned snapshot)
        id: image
        env: {PREFIX: "${{ steps.key.outputs.prefix }}", MATCHED: "${{ steps.cache.outputs.cache-matched-key }}"}
        run: |
          if [ -n "$MATCHED" ]; then
            sha=${MATCHED#"$PREFIX"}
            [[ $sha =~ ^[0-9a-f]{64}$ ]] || { echo "cache key $MATCHED holds no SHA-256"; exit 1; }
            echo "$sha  dl/image/image.tar.zst" | sha256sum --strict -c -
            zstd -dc dl/image/image.tar.zst | docker load
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            rm -rf dl/image
            docker build -t cppmpas-ci src/ci
            mkdir -p dl/image && docker save cppmpas-ci | zstd -T0 -6 -q -o dl/image/image.tar.zst
            sha=$(sha256sum dl/image/image.tar.zst | cut -d' ' -f1)
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
          echo "image_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "image_key=$PREFIX$sha" >> "$GITHUB_OUTPUT"
          docker run --rm cppmpas-ci cat /opt/packages.tsv > packages.tsv
          ls -l dl/image; echo "image archive sha256 $sha"
      - uses: actions/cache/save@v4
        if: steps.image.outputs.built == 'true'
        continue-on-error: true
        with: {path: dl/image, key: "${{ steps.image.outputs.image_key }}"}
      - uses: actions/upload-artifact@v4
        with: {name: image, path: dl/image/image.tar.zst, retention-days: 3, compression-level: 0, if-no-files-found: error}
      - name: build (Release, CPU) and the libmvec preload
        run: bash src/ci/in_container.sh "$PWD/w" bash /w/ci/build.sh build
      - name: plan
        id: plan
        run: |
          python3 src/ci/plan.py w/out/tests.json "$LABELS" plan --src-root src | tee -a "$GITHUB_STEP_SUMMARY"
          echo "matrix=$(cat plan/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "common_key=$(python3 -c 'import json; print(json.load(open("plan/data.json"))["include"][0]["key"])')" >> "$GITHUB_OUTPUT"
          cp w/out/tests.json w/out/versions.txt packages.tsv plan/
      - name: pack the build tree and the source tree
        run: |
          tar -C w --exclude='*.o' --exclude='*.a' -cf - build | zstd -T0 -q -o build.tar.zst
          tar -C src --exclude=.git -cf - . | zstd -T0 -q -o src.tar.zst
          ls -l build.tar.zst src.tar.zst
      - uses: actions/upload-artifact@v4
        with: {name: src, path: src.tar.zst, retention-days: 3, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: build, path: build.tar.zst, retention-days: 3, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with: {name: plan, path: plan/, retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: logs-build, path: "w/out/*.log\nw/out/*.txt", retention-days: 30}

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_min }}
    strategy:
      fail-fast: false
      # the account's runners are shared: one run takes at most 10 at once, so two runs fit the project's 20
      # (fewer when other jobs of the project run: input max_parallel)
      max-parallel: ${{ fromJSON(inputs.max_parallel || '10') > 10 && 10 || fromJSON(inputs.max_parallel || '10') }}
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    name: test ${{ matrix.name }}
    steps:
      - name: disk
        run: |
          # the run directory needs at most about 25 GB (the 6-release job: the archives and what they hold); the
          # runner's preinstalled tools are removed only when less than 60 GB is free (that takes about 3 minutes)
          free_ws=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1)
          if [ "${{ matrix.ref1 }}" != "" ] && [ "$free_ws" -lt 60000000000 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
              /usr/local/share/boost /usr/share/swift /usr/local/julia* /usr/local/share/powershell /usr/local/share/chromium
            sudo docker image prune -af > /dev/null
          fi
          df -h / /mnt 2>/dev/null || df -h /
          # the run directory on the larger disk (CTest only sees the container's fixed /w paths)
          free_ws=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1)
          free_mnt=$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${free_mnt:-0}" -gt "$free_ws" ] && sudo mkdir -p /mnt/w && sudo chown "$(id -u):$(id -g)" /mnt/w; then
            echo "BASE=/mnt/w" >> "$GITHUB_ENV"
          else
            echo "BASE=$GITHUB_WORKSPACE/w" >> "$GITHUB_ENV"
          fi
      # the source tree the build job built (also a commit that is not on GitHub), with its ci/ scripts
      - uses: actions/download-artifact@v4
        with: {name: src, path: .}
      - run: mkdir -p src && zstd -dc src.tar.zst | tar -xf - -C src && rm src.tar.zst
      - uses: actions/download-artifact@v4
        with: {name: plan, path: plan}
      - uses: actions/download-artifact@v4
        with: {name: build, path: .}
      # the image archive the build job made or checked (an artifact of this run, never a cache entry)
      - uses: actions/download-artifact@v4
        with: {name: image, path: dl/image}
      # the inputs with a cache key (ci/plan.py: the small, often used ones); a miss is not an error
      - uses: actions/cache/restore@v4
        id: rc
        if: ${{ !matrix.gpu }}
        with: {path: dl/common, key: "${{ needs.build.outputs.common_key }}${{ env.SALT }}"}
      - uses: actions/cache/restore@v4
        id: r1
        if: matrix.key1 != ''
        with: {path: "dl/${{ matrix.ref1 }}", key: "${{ matrix.key1 }}${{ env.SALT }}"}
      - uses: actions/cache/restore@v4
        id: r2
        if: matrix.key2 != ''
        with: {path: "dl/${{ matrix.ref2 }}", key: "${{ matrix.key2 }}${{ env.SALT }}"}
      - uses: actions/cache/restore@v4
        id: r3
        if: matrix.key3 != ''
        with: {path: "dl/${{ matrix.ref3 }}", key: "${{ matrix.key3 }}${{ env.SALT }}"}
      - uses: actions/cache/restore@v4
        id: r4
        if: matrix.key4 != ''
        with: {path: "dl/${{ matrix.ref4 }}", key: "${{ matrix.key4 }}${{ env.SALT }}"}
      - uses: actions/cache/restore@v4
        id: r5
        if: matrix.key5 != ''
        with: {path: "dl/${{ matrix.ref5 }}", key: "${{ matrix.key5 }}${{ env.SALT }}"}
      - uses: actions/cache/restore@v4
        id: r6
        if: matrix.key6 != ''
        with: {path: "dl/${{ matrix.ref6 }}", key: "${{ matrix.key6 }}${{ env.SALT }}"}
      # every input the cache did not give (no key, a miss, an evicted entry, a restored entry whose files do not
      # match ci/data.tsv): downloaded from its release and checked against its SHA-256 (ci/data.sh fetch), at
      # most 3 attempts
      - name: data (cache or release)
        env: {ITEMS: "${{ !matrix.gpu && 'common' || '' }} ${{ matrix.ref1 }} ${{ matrix.ref2 }} ${{ matrix.ref3 }} ${{ matrix.ref4 }} ${{ matrix.ref5 }} ${{ matrix.ref6 }}"}
        run: |
          for i in $ITEMS; do
            t0=$SECONDS
            if [ -d "dl/$i" ]; then
              if awk -F'\t' -v i="$i" -v d="dl/$i" '$1 == i {print $3 "  " d "/" $2}' src/ci/data.tsv |
                 sha256sum --strict -c --quiet -; then
                echo "$i: from the cache, checked ($(du -sh "dl/$i" | cut -f1), $((SECONDS - t0)) s)"; continue
              fi
              echo "$i: the cache entry does not match ci/data.tsv; downloading it"
            fi
            ok=
            for a in 1 2 3; do
              rm -rf "dl/$i"
              if bash src/ci/data.sh fetch "$i" "dl/$i"; then ok=1; break; fi
              echo "$i: download attempt $a failed"; sleep 20
            done
            [ -n "$ok" ] || { echo "$i: not downloaded from its release after 3 attempts"; exit 1; }
            echo "$i: downloaded from its release, checked ($(du -sh "dl/$i" | cut -f1), $((SECONDS - t0)) s)"
          done
      # a cacheable input that was downloaded is saved for the next runs (several jobs may try; one wins)
      - uses: actions/cache/save@v4
        if: ${{ !matrix.gpu && steps.rc.outputs.cache-hit != 'true' }}
        continue-on-error: true
        with: {path: dl/common, key: "${{ needs.build.outputs.common_key }}${{ env.SALT }}"}
      - uses: actions/cache/save@v4
        if: matrix.key1 != '' && steps.r1.outputs.cache-hit != 'true'
        continue-on-error: true
        with: {path: "dl/${{ matrix.ref1 }}", key: "${{ matrix.key1 }}${{ env.SALT }}"}
      - uses: actions/cache/save@v4
        if: matrix.key2 != '' && steps.r2.outputs.cache-hit != 'true'
        continue-on-error: true
        with: {path: "dl/${{ matrix.ref2 }}", key: "${{ matrix.key2 }}${{ env.SALT }}"}
      - uses: actions/cache/save@v4
        if: matrix.key3 != '' && steps.r3.outputs.cache-hit != 'true'
        continue-on-error: true
        with: {path: "dl/${{ matrix.ref3 }}", key: "${{ matrix.key3 }}${{ env.SALT }}"}
      - uses: actions/cache/save@v4
        if: matrix.key4 != '' && steps.r4.outputs.cache-hit != 'true'
        continue-on-error: true
        with: {path: "dl/${{ matrix.ref4 }}", key: "${{ matrix.key4 }}${{ env.SALT }}"}
      - uses: actions/cache/save@v4
        if: matrix.key5 != '' && steps.r5.outputs.cache-hit != 'true'
        continue-on-error: true
        with: {path: "dl/${{ matrix.ref5 }}", key: "${{ matrix.key5 }}${{ env.SALT }}"}
      - uses: actions/cache/save@v4
        if: matrix.key6 != '' && steps.r6.outputs.cache-hit != 'true'
        continue-on-error: true
        with: {path: "dl/${{ matrix.ref6 }}", key: "${{ matrix.key6 }}${{ env.SALT }}"}
      - name: unpack (image, build tree, data)
        env: {REFS: "${{ matrix.ref1 }} ${{ matrix.ref2 }} ${{ matrix.ref3 }} ${{ matrix.ref4 }} ${{ matrix.ref5 }} ${{ matrix.ref6 }}",
              GPU: "${{ matrix.gpu }}", IMAGE_SHA256: "${{ needs.build.outputs.image_sha256 }}"}
        run: |
          # the image archive against the SHA-256 the build job recorded when it made or checked it
          [[ $IMAGE_SHA256 =~ ^[0-9a-f]{64}$ ]] || { echo "no image SHA-256 from the build job"; exit 1; }
          echo "$IMAGE_SHA256  dl/image/image.tar.zst" | sha256sum --strict -c -
          zstd -dc dl/image/image.tar.zst | docker load && rm -rf dl/image
          mkdir -p "$BASE" && zstd -dc build.tar.zst | tar -xf - -C "$BASE" && rm build.tar.zst
          if [ "$GPU" != true ]; then bash src/ci/data.sh extract common dl/common "$BASE/data"; fi
          for r in $REFS; do bash src/ci/data.sh extract "$r" "dl/$r" "$BASE/data"; done
          df -h "$BASE"
      - name: ctest (${{ matrix.count }} tests)
        run: bash src/ci/in_container.sh "$BASE" bash /w/ci/run_tests.sh "/w/plan/${{ matrix.tests }}" ${{ matrix.gpu && 'gpu' || 'cpu' }}
      - name: disk after
        if: always()
        run: df -h "$BASE"; du -sh "$BASE"/* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "logs-${{ matrix.name }}", path: "${{ env.BASE }}/out/", retention-days: 30}

  summary:
    needs: [build, test]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: {name: src, path: .}
      - uses: actions/download-artifact@v4
        with: {name: plan, path: plan}
      - uses: actions/download-artifact@v4
        with: {pattern: "logs-*", path: results}
      - name: verdict
        env: {RB: "${{ needs.build.result }}", RT: "${{ needs.test.result }}",
              COMMIT: "${{ needs.build.outputs.commit }}"}
        run: |
          mkdir -p src && zstd -dc src.tar.zst | tar -xf - -C src ./ci
          for d in results/logs-*; do [ -d "$d" ] && mv "$d" "results/${d#results/logs-}"; done
          set +e
          python3 src/ci/summary.py plan results summary
          st=$?
          cat summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          # this file's own check, whatever the commit under test's scripts say: every selected test of CTest's list
          # (plan/tests.json) has results in the jobs' JUnit files, each CPU test (and each fixture setup CTest
          # added) passed in every job that ran it, each GPU test was skipped (exit 77) and is not counted as
          # passed; at least one CPU test; and every job of the run succeeded
          python3 - "$LABELS" > guard.txt <<'EOF'
          import glob, json, sys
          import xml.etree.ElementTree as ET
          def labels(t):
              return next((p["value"] for p in t.get("properties", []) if p["name"] == "LABELS"), [])
          tests = json.load(open("plan/tests.json"))["tests"]
          chosen = {t["name"]: "gpu" in labels(t) for t in tests
                    if sys.argv[1] == "all" or (sys.argv[1] == "long") == ("long" in labels(t))}
          got = {}
          for f in sorted(glob.glob("results/*/junit.xml")):
              for c in ET.parse(f).getroot().iter("testcase"):
                  s = c.find("skipped")
                  skip = c.get("status") == "notrun" and s is not None and s.get("message") == "SKIP_RETURN_CODE=77"
                  got.setdefault(c.get("name"), set()).add("skipped" if skip else c.get("status"))
          bad = [f"{n}: {','.join(sorted(got.get(n, ()))) or 'no result'}" for n, gpu in chosen.items()
                 if got.get(n) != ({"skipped"} if gpu else {"run"})]
          bad += [f"{n} (fixture setup added by CTest): {','.join(sorted(s))}" for n, s in got.items()
                  if n not in chosen and s != {"run"}]
          ncpu = sum(not gpu for gpu in chosen.values())
          if ncpu == 0:
              bad.append("no CPU test selected")
          print(f"guard: {ncpu} CPU tests passed, {len(chosen) - ncpu} GPU tests skipped" if not bad else
                f"guard: FAILED, {len(bad)} problem(s):\n" + "\n".join(bad[:100]))
          sys.exit(1 if bad else 0)
          EOF
          [ $? = 0 ] || st=1
          cat guard.txt; { echo; echo "Workflow check: $(head -1 guard.txt)"; } >> "$GITHUB_STEP_SUMMARY"
          for r in "build $RB" "test $RT"; do
            set -- $r
            [ "$2" = success ] || { echo "job $1: $2" | tee -a guard.txt "$GITHUB_STEP_SUMMARY"; st=1; }
          done
          mkdir -p summary && cp guard.txt summary/
          [ -s summary/summary.json ] || echo '{}' > summary/summary.json
          ok=false; [ $st = 0 ] && ok=true
          jq --arg c "$COMMIT" --argjson ok $ok '.commit = $c | .passed = (.passed == true and $ok)' \
            summary/summary.json > summary.json.new ||
            jq -n --arg c "$COMMIT" '{commit: $c, passed: false, problems: ["summary.json is not JSON"]}' > summary.json.new
          mv summary.json.new summary/summary.json
          [ "$(jq -r .passed summary/summary.json)" = true ] || st=1
          exit $st
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: summary, path: summary/, retention-days: 30}
